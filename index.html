<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StormWatch Weather</title>
<meta name="viewport" content="width=device-width">
<style>
body{background:#07111f;color:#fff;font-family:Arial,sans-serif;margin:0}
.wrap{width:92%;max-width:900px;margin:0 auto;padding:18px}
h1{font-size:30px;margin:4px 0}.sub{color:#9fb5c9;margin-bottom:16px}
.card{background:#102238;border:2px solid #294766;padding:16px;margin:12px 0}
.temp{font-size:64px;font-weight:bold}.condition{font-size:25px}
.row{font-size:20px;margin:8px 0}.label{color:#9fb5c9}
.storm{border-color:#b38b2e}.storm h2{margin-top:0}
.small{font-size:14px;color:#9fb5c9;margin-top:18px}
button{font-size:20px;padding:10px 16px;background:#294766;color:white;border:0}
</style>
</head>
<body>
<div class="wrap">
<h1>STORMWATCH WEATHER</h1>
<div class="sub">Little Rock / Central Arkansas</div>

<div class="card">
<div id="status">Weather data is loading...</div>
<div class="temp" id="temp">--°</div>
<div class="condition" id="condition">Please wait</div>
<div class="row"><span class="label">High / Low:</span> <span id="hiLo">-- / --</span></div>
<div class="row"><span class="label">Wind:</span> <span id="wind">--</span></div>
<div class="row"><span class="label">Rain chance:</span> <span id="rain">--</span></div>
</div>

<div class="card storm">
<h2>STORMWATCH</h2>
<div class="row">Alerts: <strong id="alerts">Checking...</strong></div>
<div class="row" id="alertText"></div>
</div>

<div class="card">
<h2>Forecast</h2>
<div id="forecast">Loading forecast...</div>
</div>

<button onclick="loadWeather()">Refresh</button>
<div class="small">Designed for the Nintendo Wii U Internet Browser.</div>
</div>

<script>
/*
  Version 1 test page.
  The weather endpoint is intentionally isolated here so it can be
  replaced with a Wii-U-compatible server-side weather feed if needed.
*/
var LAT=34.7465, LON=-92.2896;

function show(id,txt){document.getElementById(id).innerHTML=txt;}

function loadWeather(){
  show("status","Connecting to weather service...");
  /*
    Open-Meteo is used for the first compatibility test because it
    provides JSON over HTTPS without an API key.
  */
  var url="https://api.open-meteo.com/v1/forecast?latitude="+LAT+
    "&longitude="+LON+
    "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m"+
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
    "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago";

  var x=new XMLHttpRequest();
  x.open("GET",url,true);
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status!==200){
      show("status","Weather service could not be reached.");
      show("condition","Browser compatibility test failed");
      return;
    }
    try{
      var d=JSON.parse(x.responseText);
      var c=d.current, q=d.daily;
      show("status","Updated: "+c.time.replace("T"," "));
      show("temp",Math.round(c.temperature_2m)+"°F");
      show("condition",weatherName(c.weather_code));
      show("hiLo",Math.round(q.temperature_2m_max[0])+"°F / "+Math.round(q.temperature_2m_min[0])+"°F");
      show("wind",Math.round(c.wind_speed_10m)+" mph");
      show("rain",q.precipitation_probability_max[0]+"%");
      var s="";
      for(var i=0;i<5;i++){
        s+="<div class='row'><strong>"+day(q.time[i])+
          "</strong> — "+weatherName(q.weather_code[i])+
          " — "+Math.round(q.temperature_2m_max[i])+"° / "+
          Math.round(q.temperature_2m_min[i])+"° — rain "+
          q.precipitation_probability_max[i]+"%</div>";
      }
      show("forecast",s);
      show("alerts","See NWS alerts");
      show("alertText","Live NWS alert integration will be added after the browser/API compatibility test.");
    }catch(e){
      show("status","Weather response could not be read.");
    }
  };
  x.send(null);
}

function day(s){
  var d=new Date(s+"T12:00:00");
  var names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return names[d.getDay()];
}
function weatherName(c){
  if(c===0)return"Clear";
  if(c===1||c===2||c===3)return"Partly cloudy";
  if(c===45||c===48)return"Fog";
  if(c>=51&&c<=57)return"Drizzle";
  if(c>=61&&c<=67)return"Rain";
  if(c>=71&&c<=77)return"Snow";
  if(c>=80&&c<=82)return"Rain showers";
  if(c>=85&&c<=86)return"Snow showers";
  if(c>=95&&c<=99)return"Thunderstorm";
  return"Unknown";
}
loadWeather();
</script>
</body>
</html>
